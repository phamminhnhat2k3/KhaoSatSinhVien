services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: student_survey
      MYSQL_USER: survey
      MYSQL_PASSWORD: survey
      MYSQL_ROOT_PASSWORD: local-root-only
    ports:
      - "3306:3306"
    volumes:
      - survey_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-plocal-root-only"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  survey_mysql:
