<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1210" viewBox="0 0 1400 1210"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#64748b"/></marker></defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#172b46}.section{font-size:19px;font-weight:700}.note{font-size:13px;fill:#526579}.label{font-size:16px;font-weight:700}.name{font-size:12px;fill:#175ca0}.keys{font-size:10px;fill:#5b6e84}.edge{stroke:#64748b;stroke-width:1.5;fill:none}.rel{font-size:11px;fill:#526579;text-anchor:middle}</style><rect width="1400" height="1210" fill="#f4f7fb"/><text x="40" y="48" font-size="30" font-weight="700">Sơ đồ database — Bản tinh gọn</text><text x="40" y="80" class="note">Lắng nghe sinh viên · Các bảng và quan hệ chính, chia theo nghiệp vụ · 01/11/2026</text><rect x="30" y="125" width="1340" height="205" rx="14" fill="#ffffff" stroke="#dbe4ee"/><text x="55" y="158" class="section">01  Sinh viên và đăng ký học</text><text x="55" y="183" class="note">Khoa quản lý sinh viên qua lớp hành chính; sinh viên đăng ký vào lớp học phần.</text><g><rect x="60" y="205" width="220" height="78" rx="10" fill="#eff6ff" stroke="#93c5fd"/><text x="74" y="228" class="label">Khoa</text><text x="74" y="248" class="name">Faculty</text><text x="74" y="267" class="keys">id · code · name</text></g><g><rect x="320" y="205" width="220" height="78" rx="10" fill="#eff6ff" stroke="#93c5fd"/><text x="334" y="228" class="label">Lớp hành chính</text><text x="334" y="248" class="name">AcademicClass</text><text x="334" y="267" class="keys">id · facultyId</text></g><g><rect x="580" y="205" width="220" height="78" rx="10" fill="#eff6ff" stroke="#93c5fd"/><text x="594" y="228" class="label">Sinh viên</text><text x="594" y="248" class="name">StudentProfile</text><text x="594" y="267" class="keys">id · userId · academicClassId</text></g><g><rect x="840" y="205" width="220" height="78" rx="10" fill="#eff6ff" stroke="#93c5fd"/><text x="854" y="228" class="label">Đăng ký học</text><text x="854" y="248" class="name">Enrollment</text><text x="854" y="267" class="keys">classId + studentId (PK)</text></g><g><rect x="1100" y="205" width="220" height="78" rx="10" fill="#eff6ff" stroke="#93c5fd"/><text x="1114" y="228" class="label">Lớp học phần</text><text x="1114" y="248" class="name">CourseClass</text><text x="1114" y="267" class="keys">id · courseId · semesterId</text></g><path d="M280 244 L320 244" class="edge" marker-end="url(#arrow)"/><text x="300" y="237" class="rel">1 : N</text><path d="M540 244 L580 244" class="edge" marker-end="url(#arrow)"/><text x="560" y="237" class="rel">1 : N</text><path d="M800 244 L840 244" class="edge" marker-end="url(#arrow)"/><text x="820" y="237" class="rel">1 : N</text><path d="M1100 244 L1060 244" class="edge" marker-end="url(#arrow)"/><text x="1080" y="237" class="rel">1 : N</text><rect x="30" y="360" width="1340" height="205" rx="14" fill="#ffffff" stroke="#dbe4ee"/><text x="55" y="393" class="section">02  Môn học và giảng viên</text><text x="55" y="418" class="note">Một lớp học phần có thể được nhiều giảng viên thực dạy; phân công nằm trong CourseTeaching.</text><g><rect x="60" y="440" width="220" height="78" rx="10" fill="#eff6ff" stroke="#93c5fd"/><text x="74" y="463" class="label">Môn học</text><text x="74" y="483" class="name">Course</text><text x="74" y="502" class="keys">id · facultyId</text></g><g><rect x="320" y="440" width="220" height="78" rx="10" fill="#eff6ff" stroke="#93c5fd"/><text x="334" y="463" class="label">Lớp học phần</text><text x="334" y="483" class="name">CourseClass</text><text x="334" y="502" class="keys">id · courseId · semesterId</text></g><g><rect x="580" y="440" width="220" height="78" rx="10" fill="#eff6ff" stroke="#93c5fd"/><text x="594" y="463" class="label">Phân công thực dạy</text><text x="594" y="483" class="name">CourseTeaching</text><text x="594" y="502" class="keys">classId + lecturerId (PK)</text></g><g><rect x="840" y="440" width="220" height="78" rx="10" fill="#eff6ff" stroke="#93c5fd"/><text x="854" y="463" class="label">Giảng viên</text><text x="854" y="483" class="name">LecturerProfile</text><text x="854" y="502" class="keys">id · userId · facultyId</text></g><g><rect x="1100" y="440" width="220" height="78" rx="10" fill="#eff6ff" stroke="#93c5fd"/><text x="1114" y="463" class="label">Khoa</text><text x="1114" y="483" class="name">Faculty</text><text x="1114" y="502" class="keys">id · code · name</text></g><path d="M280 479 L320 479" class="edge" marker-end="url(#arrow)"/><text x="300" y="472" class="rel">1 : N</text><path d="M540 479 L580 479" class="edge" marker-end="url(#arrow)"/><text x="560" y="472" class="rel">1 : N</text><path d="M840 479 L800 479" class="edge" marker-end="url(#arrow)"/><text x="820" y="472" class="rel">1 : N</text><path d="M1100 479 L1060 479" class="edge" marker-end="url(#arrow)"/><text x="1080" y="472" class="rel">1 : N</text><rect x="30" y="595" width="1340" height="205" rx="14" fill="#ffffff" stroke="#dbe4ee"/><text x="55" y="628" class="section">03  Mẫu và đợt khảo sát</text><text x="55" y="653" class="note">Mẫu chứa câu hỏi và lựa chọn. Đợt khảo sát sử dụng mẫu, có phạm vi và thời gian riêng.</text><g><rect x="60" y="675" width="220" height="78" rx="10" fill="#eff6ff" stroke="#93c5fd"/><text x="74" y="698" class="label">Đợt khảo sát</text><text x="74" y="718" class="name">SurveyCampaign</text><text x="74" y="737" class="keys">id · templateId · scope · status</text></g><g><rect x="380" y="675" width="220" height="78" rx="10" fill="#eff6ff" stroke="#93c5fd"/><text x="394" y="698" class="label">Mẫu khảo sát</text><text x="394" y="718" class="name">SurveyTemplate</text><text x="394" y="737" class="keys">id · title · version</text></g><g><rect x="700" y="675" width="220" height="78" rx="10" fill="#eff6ff" stroke="#93c5fd"/><text x="714" y="698" class="label">Câu hỏi</text><text x="714" y="718" class="name">Question</text><text x="714" y="737" class="keys">id · templateId · type</text></g><g><rect x="1020" y="675" width="220" height="78" rx="10" fill="#eff6ff" stroke="#93c5fd"/><text x="1034" y="698" class="label">Lựa chọn</text><text x="1034" y="718" class="name">QuestionOption</text><text x="1034" y="737" class="keys">id · questionId</text></g><path d="M380 714 L280 714" class="edge" marker-end="url(#arrow)"/><text x="330" y="707" class="rel">1 : N</text><path d="M600 714 L700 714" class="edge" marker-end="url(#arrow)"/><text x="650" y="707" class="rel">1 : N</text><path d="M920 714 L1020 714" class="edge" marker-end="url(#arrow)"/><text x="970" y="707" class="rel">1 : N</text><rect x="30" y="830" width="1340" height="300" rx="14" fill="#ffffff" stroke="#dbe4ee"/><text x="55" y="863" class="section">04  Giao phiếu và thu phản hồi</text><text x="55" y="888" class="note">Theo dõi ai đã hoàn thành được tách khỏi nội dung bài trả lời; không nối sinh viên trực tiếp với Submission.</text><g><rect x="60" y="910" width="220" height="78" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/><text x="74" y="933" class="label">Sinh viên</text><text x="74" y="953" class="name">StudentProfile</text><text x="74" y="972" class="keys">id · userId · academicClassId</text></g><g><rect x="350" y="910" width="220" height="78" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/><text x="364" y="933" class="label">Phiếu được giao</text><text x="364" y="953" class="name">SurveyParticipation</text><text x="364" y="972" class="keys">id · campaignId · studentId · status</text></g><g><rect x="650" y="910" width="220" height="78" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/><text x="664" y="933" class="label">Đợt khảo sát</text><text x="664" y="953" class="name">SurveyCampaign</text><text x="664" y="972" class="keys">id · templateId · scope · status</text></g><g><rect x="650" y="1035" width="220" height="78" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/><text x="664" y="1058" class="label">Bài trả lời</text><text x="664" y="1078" class="name">Submission</text><text x="664" y="1097" class="keys">id · campaignId</text></g><g><rect x="950" y="1035" width="220" height="78" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/><text x="964" y="1058" class="label">Câu trả lời</text><text x="964" y="1078" class="name">Answer</text><text x="964" y="1097" class="keys">id · submissionId · questionId</text></g><g><rect x="950" y="910" width="220" height="78" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/><text x="964" y="933" class="label">Câu hỏi</text><text x="964" y="953" class="name">Question</text><text x="964" y="972" class="keys">id · templateId · type</text></g><path d="M280 949 L350 949" class="edge" marker-end="url(#arrow)"/><text x="315" y="942" class="rel">1 : N</text><path d="M650 949 L570 949" class="edge" marker-end="url(#arrow)"/><text x="610" y="942" class="rel">1 : N</text><path d="M760 988 L760 1035" class="edge" marker-end="url(#arrow)"/><text x="760" y="1004.5" class="rel">1 : N</text><path d="M870 1074 L950 1074" class="edge" marker-end="url(#arrow)"/><text x="910" y="1067" class="rel">1 : N</text><path d="M1060 988 L1060 1035" class="edge" marker-end="url(#arrow)"/><text x="1060" y="1004.5" class="rel">1 : N</text><text x="45" y="1155" class="note">1 : N = một – nhiều. Các bảng lặp giữa các khối là cùng một bảng trong database.</text><text x="45" y="1179" class="note">Lược bớt tài khoản, vai trò, học kỳ, thông báo, nhật ký, các bảng chốt môn/giảng viên và dữ liệu cũ. Xem bản đầy đủ khi cần tra khóa.</text></svg>